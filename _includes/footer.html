{%- assign lang = page.lang | default: "en" -%}
{%- assign t = site.data.i18n[lang] -%}
<footer class="footer">
  <div class="footer__inner">
    <span class="footer__mark">// {{ site.author }}</span>
    <ul class="footer__links">
      <li><a href="{{ site.htb_url }}" rel="me noopener" target="_blank">Hack The Box</a></li>
      <li><a href="{{ site.linkedin_url }}" rel="me noopener" target="_blank">LinkedIn</a></li>
      <li><a href="{{ site.credly_url }}" rel="me noopener" target="_blank">Credly</a></li>
      <li><a href="{{ site.github_url }}" rel="me noopener" target="_blank">GitHub</a></li>
      <li><a href="{% if lang == 'nl' %}{{ '/nl/feed.xml' | relative_url }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}">RSS</a></li>
    </ul>
    <span class="footer__note">{{ t.footer.note }}</span>
  </div>
</footer>
